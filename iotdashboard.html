<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard - Redesigned</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #283048, #859398);
            color: #fff;
        }

        .sidebar {
            width: 250px;
            background-color: #1e2a38;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 10px;
            background-color: #34495e;
            border-radius: 5px;
            text-align: center;
            transition: background 0.3s;
        }

        .sidebar a:hover {
            background-color: #859398;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .top-nav {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .top-nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 10px 20px;
            background-color: #34495e;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .top-nav a:hover {
            background-color: #859398;
        }

        .device-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .sensor-container {
            display: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sensor {
            width: 120px;
            height: 60px;
            background-color: #859398;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .sensor:hover {
            transform: scale(1.1);
            background-color: #34495e;
        }

        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('https://via.placeholder.com/1920x1080') no-repeat center center/cover;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="#">Dashboard</a>
        <a href="#">Devices</a>
        <a href="#">Settings</a>
        <a href="#">Help</a>
    </div>

    <div class="main-container">
        <div class="top-nav">
            <a href="#overview">Overview</a>
            <a href="#settings">Settings</a>
        </div>

        <div class="device-name">Device Name</div>

        <div class="sensor-container">
            <!-- Circles representing sensors -->
            <div class="sensor">Sensor 1</div>
            <div class="sensor">Sensor 2</div>
            <div class="sensor">Sensor 3</div>
            <div class="sensor">Sensor 4</div>
            <div class="sensor">Sensor 5</div>
            <div class="sensor">Sensor 6</div>
            <div class="sensor">Sensor 7</div>
            <div class="sensor">Sensor 8</div>
        </div>
    </div>

    <div class="background-container"></div>
</body>
</html>
